[versions]
# App version, referenced by app/build.gradle.kts. Bump appVersionCode on
# every release build; appVersionName is what users see.
appVersionCode = "2"
appVersionName = "1.1"
agp = "8.13.0"
kotlin = "2.1.0"
junit = "4.13.2"
coreKtx = "1.17.0"
appcompat = "1.7.1"
material = "1.13.0"
constraintlayout = "2.2.1"
ktor = "2.3.13"
media3 = "1.7.1"
documentfile = "1.0.1"
mp3agic = "0.9.1"
coroutines = "1.9.0"
slf4j = "2.0.17"
sqliteJdbc = "3.46.1.3"
jna = "5.14.0"
gst1JavaCore = "1.4.0"
jaudiotagger = "3.0.1"
dbusJava = "5.2.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
mp3agic = { group = "com.mpatric", name = "mp3agic", version.ref = "mp3agic" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
sqlite-jdbc = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqliteJdbc" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
# Desktop playback: JNA bindings over the system GStreamer, so the .deb carries
# no codec of its own and rides the distro's plugin sets.
gst1-java-core = { group = "org.freedesktop.gstreamer", name = "gst1-java-core", version.ref = "gst1JavaCore" }
# Desktop tag reading/writing, replacing the Android build's mp3agic: covers
# FLAC/OGG/M4A as well as MP3, which the phone's hand-rolled ID3 writer does not.
jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }
# MPRIS over the session bus — the desktop's answer to the Android build's
# MediaSession. Pure Java: the transport is the JDK's own Unix-domain socket
# support, so the .deb gains no native dependency for it.
dbus-java-core = { group = "com.github.hypfvieh", name = "dbus-java-core", version.ref = "dbusJava" }
dbus-java-transport = { group = "com.github.hypfvieh", name = "dbus-java-transport-native-unixsocket", version.ref = "dbusJava" }
